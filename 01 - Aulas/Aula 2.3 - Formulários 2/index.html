<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <a href="./index.html"><h1>Formulários</h1></a>
    <h2>CONTATO</h2>
    <form action="">
      <label for="nome">Nome: </label>
      <input
        type="text"
        id="nome"
        disabled
        placeholder="Digite seu nome"
      /><br />
      <label for="email">E-Mail: </label> <input type="email" id="email" />
      <br />
      <label for="motivo">Motivo: </label>
      <select id="motivo">
        <option value="reclamação">Reclamação</option>
        <option value="elogio">Elogio</option>
        <option value="sugestao">Sugestão</option>
      </select>
      <br />
      <label for="mensagem">Mensagem: </label>
      <textarea type="mensagem" draggable="false">
        o 'value' do textarea é dentro da marcação!
      </textarea>
      <input type="submit" value="ENVIAR" />
    </form>

    <h2>ENQUETE</h2>
    <form action="">
      <p>qual sua disciplina favorita?</p>
      <label
        ><input type="radio" checked name="" value="autoria" /> Autoria</label
      >
      <br />
      <label><input type="radio" name="disc" value="prog" /> Minora</label>
      <br />
      <label
        ><input type="radio" name="disc" value="filosofia" /> Filosofia</label
      >
      <br />
      <label><input type="radio" name="disc" value="Design" /> Design</label>
      <input type="submit" value="ENVIAR" />
    </form>
  </body>
</html>
