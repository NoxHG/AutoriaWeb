<!-- 
  o atributo box-sizing é responsável por manter a largura do elemento
  igual a largura definida, quando o padding é delimitado, visto que
  ao alterar o padding a largura é alterada, geralmente.
  (sem o box sizing) 

  quando se define o padding e o width, a largura do elemento da marcação é alterada.
  isto é, se eu definir 20rem de largura e 4rem de padding, quanto fica a largra final?
  28rem.
  (4 de um lado e 4 de outro)

  ao definir o boxsizing, a largura se mantem 20rem, e o padding é definido para dentro da marcação.
 -->
